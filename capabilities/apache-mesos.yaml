naftiko: 1.0.0-alpha2
info:
  label: Apache Mesos Operator HTTP API
  description: 'Apache Mesos Operator HTTP API. 1 operations. Lead operation: Operator HTTP API call. Self-contained Naftiko
    capability covering one Apache Mesos business surface.'
  tags:
  - Apache Mesos
  - Apache Mesos Operator HTTP API
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_MESOS_API_KEY: APACHE_MESOS_API_KEY
capability:
  consumes:
  - type: http
    namespace: apache-mesos
    baseUri: http://localhost:5050
    description: Apache Mesos Operator HTTP API business capability. Self-contained, no shared references.
    resources:
    - name: api-v1
      path: /api/v1
      operations:
      - name: post
        method: POST
        description: Operator HTTP API call
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: apache-mesos-rest
    port: 8080
    description: REST adapter for Apache Mesos Operator HTTP API. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/v1
      name: api-v1
      description: REST surface for api-v1.
      operations:
      - method: POST
        name: post
        description: Operator HTTP API call
        call: apache-mesos.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: apache-mesos-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache Mesos Operator HTTP API. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: operator-http-api-call
      description: Operator HTTP API call
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: apache-mesos.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
